name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'package.json'
      - 'VERSION'
      - '.github/workflows/android-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Dependency security audit
        run: npm audit --json > npm-audit.json || true
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Apply owner logo as Android app icon
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin
          mkdir -p /tmp/kostpro-icon
          rsvg-convert -w 512 -h 512 public/kostpro-owner-logo.svg -o /tmp/kostpro-icon/icon.png
          test -s /tmp/kostpro-icon/icon.png
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            case "$density" in
              mdpi) size=48 ;;
              hdpi) size=72 ;;
              xhdpi) size=96 ;;
              xxhdpi) size=144 ;;
              xxxhdpi) size=192 ;;
            esac
            mkdir -p "android/app/src/main/res/mipmap-$density"
            convert /tmp/kostpro-icon/icon.png -resize "${size}x${size}" "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-$density/ic_launcher.png" "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
      - name: Set app version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s = s.replace('versionCode 1', 'versionCode 17')
          s = s.replace('versionName "1.0"', 'versionName "1.7.0"')
          p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify and rename APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "KOSTPRO V1.7.0.apk"
          ls -lh "KOSTPRO V1.7.0.apk"
      - name: Upload dependency audit
        uses: actions/upload-artifact@v4
        with:
          name: KOSTPRO V1.7.0 - dependency audit
          path: npm-audit.json
          retention-days: 30
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KOSTPRO V1.7.0
          path: "KOSTPRO V1.7.0.apk"
          retention-days: 30
