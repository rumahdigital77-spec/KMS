<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 632 725" role="img" aria-labelledby="title desc">
  <title id="title">KOSTPRO</title>
  <desc id="desc">KOSTPRO Managed Smart Your Property logo</desc>
  <!-- production sidebar logo -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".28" stop-color="#cfd5dd"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".72" stop-color="#aeb7c3"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#f8fafc"/><stop offset="1" stop-color="#dbe2ea"/></linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cbd5e1"/><stop offset=".5" stop-color="#f1f5f9"/><stop offset="1" stop-color="#aeb8c5"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#7dd3fc" stop-opacity=".55"/><stop offset=".55" stop-color="#38bdf8" stop-opacity=".18"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020617" flood-opacity=".22"/></filter>
  </defs>
  <ellipse cx="316" cy="220" rx="245" ry="235" fill="url(#halo)"/>
  <g fill="none" stroke="url(#metal)" stroke-linecap="round" filter="url(#soft)">
    <circle cx="316" cy="220" r="155" stroke-width="31"/>
    <path d="M316 105v103" stroke-width="31"/>
    <path d="M251 141a103 103 0 1 0 130 0" stroke-width="31"/>
  </g>
  <g fill="#dff6ff" opacity=".9" filter="url(#glow)"><circle cx="468" cy="112" r="3"/><circle cx="488" cy="132" r="2"/><circle cx="154" cy="286" r="3"/><circle cx="130" cy="313" r="2"/><circle cx="452" cy="92" r="2"/><circle cx="183" cy="328" r="2"/></g>
  <text x="316" y="505" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="98" font-weight="800" letter-spacing="1.5" fill="url(#word)" filter="url(#soft)">KOSTPRO</text>
  <text x="316" y="570" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="500" letter-spacing=".5" fill="url(#tag)">Managed Smart Your Property</text>
</svg>