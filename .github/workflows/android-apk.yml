name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'package.json'
      - 'VERSION'
      - '.github/workflows/android-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Dependency security audit
        run: npm audit --json > npm-audit.json || true
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Apply owner logo as Android app icon
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick curl unzip
          mkdir -p /tmp/kostpro-icon
          curl -L --fail --silent --show-error "https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-4a88-81fa-bb5b-805928f81627/raw?se=2026-09-29T23%3A05%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=b9df7e26-398d-5019-9a13-b8713051a0dd&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T23%3A00%3A23Z&ske=2026-09-30T23%3A00%3A23Z&sks=b&skv=2026-02-06&sig=4xi%2Bt%2Bt5YsFARIlq5DVIcQaSmOovLZyGY2aKHf%2FYruY%3D" -o /tmp/kostpro-icon/artifact.zip
          unzip -o /tmp/kostpro-icon/artifact.zip -d /tmp/kostpro-icon/artifact
          LOGO="$(find /tmp/kostpro-icon/artifact -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) | head -n 1)"
          test -n "$LOGO"
          convert "$LOGO" -background none -resize 512x512^ -gravity center -extent 512x512 /tmp/kostpro-icon/icon.png
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            case "$density" in
              mdpi) size=48 ;;
              hdpi) size=72 ;;
              xhdpi) size=96 ;;
              xxhdpi) size=144 ;;
              xxxhdpi) size=192 ;;
            esac
            mkdir -p "android/app/src/main/res/mipmap-$density"
            convert /tmp/kostpro-icon/icon.png -resize "${size}x${size}" "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-$density/ic_launcher.png" "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
      - name: Set app version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s = s.replace('versionCode 1', 'versionCode 17')
          s = s.replace('versionName "1.0"', 'versionName "1.7.0"')
          p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload dependency audit
        uses: actions/upload-artifact@v4
        with:
          name: KOSTPRO-v1.7.0-dependency-audit
          path: npm-audit.json
          retention-days: 30
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KOSTPRO-v1.7.0-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
